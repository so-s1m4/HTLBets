<section class="auth-page">
  <app-auth-panel
    title="Set your password"
    subtitle="First sign in is still done with the email code. After that, secure the account with a password for future logins."
  >
    <div class="page-stack">
      <app-input
        label="New password"
        placeholder="Minimum 8 characters"
        type="password"
        [value]="password()"
        (valueChange)="password.set($event)"
      />

      <app-input
        label="Repeat password"
        placeholder="Repeat the same password"
        type="password"
        [value]="confirmPassword()"
        (valueChange)="confirmPassword.set($event)"
      />

      @if (error()) {
        <p class="status-copy text-danger">{{ error() }}</p>
      }

      <app-button block [disabled]="loading()" (click)="submit()">
        {{ loading() ? 'Saving password...' : 'Save password and continue' }}
      </app-button>
    </div>
  </app-auth-panel>
</section>
