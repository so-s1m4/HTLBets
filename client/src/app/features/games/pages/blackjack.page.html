<app-game-shell
  title="Blackjack"
  subtitle="A polished felt table with animated dealing and clear hit, stand, and double controls."
  [connectionState]="socket.connectionState()"
  [currentBet]="currentBet()"
  [error]="socket.lastError() || ''"
  [splitSidebar]="!isFullscreen()"
  (fullscreenChange)="setFullscreen($event)"
>
  <app-card table [class.fullscreen]="isFullscreen()" [class.table-fullscreen]="isFullscreen()">
    <div
      class="blackjack-table"
      [class.blackjack-table--fullscreen]="isFullscreen()"
      [style.--blackjack-card-back-url]="'url(' + selectedBackImageUrl() + ')'"
    >
      <div class="blackjack-table__surface"></div>
      <div class="blackjack-table__deck" [class.blackjack-table__deck--active]="isDealing()" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

      @if (resultBanner(); as result) {
        <div class="blackjack-table__overlay">
          <div class="blackjack-status-banner" [class.blackjack-status-banner--loss]="result.tone === 'loss'" [class.blackjack-status-banner--win]="result.tone === 'win'">
            <strong>{{ result.title }}</strong>
            <span>{{ result.amount | credits }}</span>
          </div>
        </div>
      }

      <div class="page-stack blackjack-table__content">
        <div class="blackjack-table__hand-zone blackjack-table__hand-zone--dealer">
          <app-blackjack-hand
            label="Dealer"
            [cards]="displayedDealerHand()"
            [score]="displayedDealerScore()"
            [backImageUrl]="selectedBackImageUrl()"
            [faceImageTemplate]="selectedFaceImageTemplate()"
            [hidden]="dealerHandHidden()"
            [isDealer]="true"
          />
        </div>

        <div class="blackjack-table__hand-zone blackjack-table__hand-zone--player">
          <div class="blackjack-table__player-hands" [class.blackjack-table__player-hands--split]="isSplitView()">
          @for (hand of displayedPlayerHands(); track $index) {
            <app-blackjack-hand
              [label]="playerHandLabel($index)"
              [cards]="hand.cards"
              [score]="hand.score"
              [backImageUrl]="selectedBackImageUrl()"
              [faceImageTemplate]="selectedFaceImageTemplate()"
              [caption]="playerHandCaption(hand)"
              [active]="isSplitView() && hand.active"
              [hidden]="playerHandsHidden()"
            />
          }
          </div>
        </div>
      </div>
    </div>
  </app-card>

  <app-card sidebar class="blackjack-sidebar" [class.sidebar-fullscreen]="isFullscreen()">
    <div class="page-stack">
      @if (isInsuranceDecision()) {
        <div class="page-stack">
          <app-button block [disabled]="!canTakeInsurance()" (click)="action('insurance')">
            Take insurance
          </app-button>
          <app-button variant="secondary" block (click)="action('skip-insurance')">No insurance</app-button>
        </div>
      } @else if (isRoundActive()) {
        <div class="page-stack">
          <app-button block (click)="action('hit')">Hit</app-button>
          <app-button variant="secondary" block (click)="action('stand')">Stand</app-button>
          <app-button
            variant="ghost"
            block
            [disabled]="!canDouble()"
            (click)="action('double')"
          >
            Double
          </app-button>
          <app-button
            variant="ghost"
            block
            [disabled]="!canSplit()"
            (click)="action('split')"
          >
            Split
          </app-button>
        </div>
      } @else {
          <app-input
                  label="Bet amount"
                  inputMode="numeric"
                  [value]="betAmount()"
                  (valueChange)="betAmount.set($event.replace(/\D/g, ''))"
          />
        <app-button block [disabled]="isDealing()" (click)="deal()">Deal cards</app-button>
      }
    </div>
  </app-card>
</app-game-shell>
