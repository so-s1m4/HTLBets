    <app-game-shell
      title="Roulette"
      subtitle="A premium demo wheel with strong mechanical depth, tactile chips, and a CSS-driven ball and wheel spin sequence."
      [connectionState]="socket.connectionState()"
      [currentBet]="currentBet()"
      [error]="socket.lastError() || ''"
      [hasSidebar]="hasSidebarContent()"
      [splitSidebar]="false"
      (fullscreenChange)="setFullscreen($event)"
    >
      <app-card table [class.fullscreen]="isFullscreen()">
        <div class="roulette-table" [class.roulette-table--fullscreen]="isFullscreen()">
          <div class="roulette-table__topline">
            <span class="roulette-table__brand">Roulette Royale</span>
            <span class="pill">Round #{{ viewState()?.roundId || 1 }}</span>
            <span class="pill">{{ countdownLabel() }}</span>
            <span class="pill">{{ isSpinning() ? 'Spinning' : 'Open for bets' }}</span>
          </div>

          <div class="roulette-table__surface">
            @if (resultBanner(); as result) {
              <div class="roulette-table__overlay">
                <div class="roulette-status-banner" [class.roulette-status-banner--loss]="result.tone === 'loss'" [class.roulette-status-banner--win]="result.tone === 'win'">
                  <strong>{{ result.title }}</strong>
                  <span>{{ result.amount | credits }}</span>
                </div>
              </div>
            }

              <img src="/roulette_table.png" alt="TableBackground" class="roulette-table__background" aria-hidden="true" />



            <div class="roulette-table__wheel-bay">
              <div class="roulette-table__wheel-shell">
                <app-roulette-wheel
                  [wheelRotation]="wheelRotation()"
                  [ballRotation]="ballRotation()"
                  [spinning]="isSpinning()"
                />
              </div>

            </div>

            <div class="roulette-table__board-bay">
              <app-roulette-board
                [selectedType]="selectedType()"
                [selectedValue]="selectedValue()"
                [aggregates]="viewState()?.aggregates || []"
                (selectionSelected)="placeSelection($event)"
              />
            </div>


              <div class="roulette-table__rail">
                  <div class="roulette-table__rail-tray">
                      <div class="roulette-table__chip-row">
                          @for (chip of chipOptions; track chip.value) {
                              <button
                                      class="roulette-chip"
                                      [class.active]="selectedChip() === chip.value"
                                      (click)="selectChip(chip.value)"
                              >
                                  <img class="roulette-chip__art" [src]="chip.asset" alt="" aria-hidden="true">
                                  <span class="roulette-chip__label">{{ chip.label }}</span>
                              </button>
                          }
                      </div>

                      <div class="roulette-table__bet-controls">
                          <app-input
                                  label="Bet amount"
                                  inputMode="numeric"
                                  [value]="betAmount()"
                                  (valueChange)="betAmount.set($event.replace(/\D/g, ''))"
                          />
                      </div>
                  </div>
              </div>
          </div>
        </div>
      </app-card>
    </app-game-shell>
