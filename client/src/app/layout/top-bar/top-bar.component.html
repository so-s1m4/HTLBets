<header class="top-bar">
  <div class="top-bar__inner">
    <a routerLink="/lobby" class="top-bar__brand">
      <img class="top-bar__logo" src="/htlbets-logo-header.png" alt="HTLBets" />
    </a>

    <nav class="top-bar__nav">
      @for (item of navItems(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="top-bar__nav-item"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="top-bar__meta">
      <div class="top-bar__balance">
        <span>$</span>
        <strong>{{ auth.currentUser()?.balance || 0 | credits }}</strong>
      </div>

      <button type="button" class="top-bar__wallet">
        <img src="/lobby-icons/wallet.png" alt=""  style="height: 2rem"/>
      </button>

      <a routerLink="/profile" class="top-bar__profile">
        <div class="top-bar__avatar">
          @if (auth.currentUser()?.avatarUrl) {
            <img [src]="auth.currentUser()!.avatarUrl!" [alt]="displayName() + ' avatar'" loading="lazy" decoding="async" referrerpolicy="no-referrer" />
          } @else {
            <span>{{ initials() }}</span>
          }
        </div>
      </a>
    </div>
  </div>
</header>
