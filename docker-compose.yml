services:
  postgres:
    networks:
      - htlbets_default
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PUBLISHED_PORT:-127.0.0.1:5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-htl_bets}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-htl_bets}']
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    networks:
      - htlbets_default
      - proxy
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_ORIGIN: http://localhost:4200
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-htl_bets}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CODE_HASH_SECRET: ${CODE_HASH_SECRET:-}
      AUTH_CODE_TTL_MINUTES: ${AUTH_CODE_TTL_MINUTES:-10}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MAIL_HOST: ${MAIL_HOST:-mail.your-domain.tld}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@htlstp.at}
      MAIL_DEBUG_BCC: ${MAIL_DEBUG_BCC:-}
    ports:
      - '${SERVER_PUBLISHED_PORT:-127.0.0.1:3000}:3000'

  client:
    networks:
      - htlbets_default
      - proxy

    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '${CLIENT_PUBLISHED_PORT:-4200}:80'

volumes:
  postgres-data:


networks:
  htlbets_default:
    driver: bridge
  proxy:
    external: true
